name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13", "3.14"]
    defaults:
      run:
        shell: bash
    env:
      LLM_MODE: replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Pytest (with slow, without live_llm and ocr_live)
        run: python -m pytest -q -m "not live_llm and not ocr_live"
      - name: F1 gate (dev, text sources)
        run: python -m eval.gate --split dev --source tekst
      - name: F1 gate (holdout, text sources)
        run: python -m eval.gate --split holdout --source tekst
      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.os }}
          path: output/.gate/
          if-no-files-found: ignore

  smoke:
    name: smoke (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13", "3.14"]
    env:
      LLM_MODE: replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke.ps1
      - name: Smoke (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/smoke.sh

  docker:
    name: docker build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t odw2json .
