# Przyklad E10: 4. typ dokumentu dodany WYLACZNIE konfiguracja (bez zmian w kodzie).
# Orzeczenie Krajowej Izby Odwolawczej: wyrok albo postanowienie. Opis pol: docs/nowy-typ-dokumentu.md.
# UWAGA: nie kopiuj do config/ w wersji oddawanej UZP - wg zadania orzeczenia KIO sa dokumentami spoza
# typow (wynik {}); ten typ to demonstracja rozszerzalnosci (README obok).
id: orzeczenie_kio
title: Orzeczenie KIO (wyrok lub postanowienie)
output_template: schemas/orzeczenie_kio.json
classify:
  title: [wyrok, postanowienie]
  title_mode: line
  header_chars: 600
  strong: [krajowa izba odwolawcza, orzeka, sygn. akt, w skladzie]
  weak: [przewodniczacy, posiedzeniu, rozprawie, protokolant, uzasadnienie]
  negative: [kwota przelewu, wnosze odwolanie, udzielam pelnomocnictwa]
  required_any: [orzeka]
  min_score: 6.0
  min_margin: 2.0
fields:
  OrzeczenieKIO.sygnatura:
    extract:
      - label: [sygn. akt, sygnatura akt]
        value: 'KIO\s*\d+/\d{2}'
        max_chars: 40
    normalize: [ws]
  OrzeczenieKIO.rodzaj:
    extract:
      - regex: {pattern: '^\s*(?P<v>WYROK|POSTANOWIENIE)\s*$', case: true}
    normalize: [lower]
    validate: {one_of: [wyrok, postanowienie]}
  OrzeczenieKIO.data:
    type: date
    extract:
      - label: [z dnia]
        max_chars: 40
  OrzeczenieKIO.przewodniczacy:
    type: name
    extract:
      - label: [przewodniczacy]
        value: '[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?\s+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?'
        case: true
        max_chars: 60
  OrzeczenieKIO.odwolujacy:
    type: company
    extract:
      - regex: 'przez\s+wykonawc[eęów]+:?\s+(?P<v>[^\n,(]+?(?:\n[^\n,(]+?)?)\s+z\s+siedzib'
  OrzeczenieKIO.zamawiajacy:
    type: company
    extract:
      # 1) uzasadnienie: "Gmina Cieszyn z siedziba w Cieszynie (dalej: „Zamawiajacy”)" - nazwa w mianowniku
      - regex: '(?:^|\n)(?:[^\n]*?KIO\s+\d+/\d{2}\s+)?(?P<v>[^\n,(]+?)\s+z\s+siedzib\w*\s+w\s+\S+\s*\(dalej:?\s*[„"]?Zamawiaj'
      # 2) komparycja: "w postepowaniu prowadzonym przez Gmine Cieszyn" - forma z dokumentu (tu biernik)
      - regex: 'prowadzonym\s+przez\s+(?:zamawiaj\w+:?\s+)?(?P<v>[^\n,(]+?(?:\n[^\n,(]+?)?)\s+z\s+siedzib'
  OrzeczenieKIO.rozstrzygniecie:
    extract:
      - phrase_lookup: rozstrzygniecie_kio
        within: {after: orzeka, max_chars: 400}
  OrzeczenieKIO.kwota_wpisu:
    type: amount
    extract:
      # "kwote 10 000 zl 00 gr" (zapis orzeczen) albo "kwote 7 500,00 zl"
      - label: [w poczet kosztow postepowania odwolawczego kwote, kwote]
        value: '\d{1,3}(?:\s?\d{3})*(?:,\d{2})?(?=\s*z[lł])'
        max_chars: 60
