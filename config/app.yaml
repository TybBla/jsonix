# Co zrobic z dokumentem, ktorego typu nie rozpoznano:
#   empty_object - plik <nazwa>.json z zawartoscia {}  (UZP, Discord 21.11 13:27: "pusty JSON z nazwa oryginalnego pliku")
#   empty_file   - plik <nazwa>.json o zerowej dlugosci (README organizatora: "pusty plik .json")
#   none         - brak pliku
unknown_output: empty_object
write_trace: true          # output/.trace/<case>/<plik>.trace.json
llm_enabled: false         # wlacza sektor B, gdy klient LLM jest gotowy

# Ingest PDF (sektor A). Backendy wybierane tu, bez zmian kodu.
ingest:
  # Decyzja orkiestratora: docs/decyzje/E2-backend-pdf.md
  backend: pypdfium2                            # pypdf | pdfplumber | pypdfium2
  fallback_backends: [pypdf, pdfplumber]        # kolejno, gdy backend rzuci wyjatek lub zwroci pusty tekst
  # Kroki czyszczenia (odw2json/ingest/clean.py), uruchamiane w tej kolejnosci na calym dokumencie.
  # Lista = clean.DEFAULT_ORDER wypisana jawnie (bez "dashes", patrz docs/decyzje/E2-backend-pdf.md).
  clean:
    - unicode_nfc
    - nbsp_to_space
    - ligatures
    - quotes
    - strip_page_artifacts
    - dehyphenate
    - join_wrapped_lines
    - collapse_spaces
  # OCR dla stron bez tekstu (obowiazkowy od E2b; decyzja: docs/decyzje/E2b-ocr-wydajnosc.md).
  # Zmiana dpi/engine_params unieważnia cache OCR (klucz je zawiera).
  ocr:
    enabled: true
    engine: rapidocr
    min_chars_per_page: 30
    dpi: 150                                    # 150 DPI = mniejsze obrazy; pokrycie nie spada wzgledem 200 (bench)
    engine_params:                              # dozwolone klucze RapidOCR(params=...), "Sekcja.parametr"
      Global.use_cls: false                     # strony skanow nie sa obrocone: klasyfikator kata ok. 2x wolniej
      Rec.rec_batch_num: 1                      # brak dopelniania wsadu szerokimi wierszami: ok. 1,5x szybciej
      EngineConfig.onnxruntime.intra_op_num_threads: 4   # wiecej watkow nie przyspiesza (mierzone)
    postprocess: [ocr_artifacts]                # kroki clean.py tylko dla tekstu z OCR (nie dla warstwy tekstowej)
    cache_dir: output/.cache/ocr                # cache wynikow OCR po hashu pliku (gitignored); decyzja E2-T5
