# Co zrobic z dokumentem, ktorego typu nie rozpoznano:
#   none       - nie tworzymy pliku JSON (odpowiedz UZP na Discordzie)
#   empty_file - tworzymy pusty plik .json (README organizatora)
unknown_output: none
