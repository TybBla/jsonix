id: przelew
title: Potwierdzenie przelewu
output_template: schemas/przelew.json
classify:
  # Wszystkie frazy i regexy dzialaja na tekscie znormalizowanym (male litery, bez polskich znakow).
  # Tytul dokumentu w naglowku (pierwsze header_chars znakow, rozstrzelone litery zwijane): +weights.title (raz).
  title:
    - potwierdzenie przelewu
    - potwierdzenie realizacji polecenia przelewu
    - potwierdzenie wykonania przelewu
    - potwierdzenie transakcji
    - potwierdzenie operacji
    - dowod wykonania przelewu
    - polecenie przelewu
  title_mode: line
  title_line_max_chars: 80     # tytul czesto z nazwa banku: "Bank X potwierdzenie przelewu krajowego"
  title_line_min_cover: 0.4
  header_chars: 600
  strong: ["przelew", "beneficjent", "zleceniodawc", "rachunek nadawcy", "rachunek obciazany", "numer transakcji"]
  # Ogolne slowa (rachunek, kwota...) wystepuja tez w ogloszeniach i broszurach - tylko po +1.
  weak: ["kwota", "rachunek", "tytul", "pln", "data transakcji", "data operacji", "nadawca", "odbiorc", "platnik"]
  # Slowa faktury (3 punkty kary kazde): sam numer rachunku i kwota to nie potwierdzenie przelewu.
  negative: ["zarzut nr", "ogloszenie o zamowieniu", "odwolujacy", "nabywca", "sprzedawca", "nip nabywcy", "stawka vat", "do zaplaty"]
  patterns:
    # numer rachunku (26 cyfr, opcjonalnie w grupach po 4) w poblizu etykiety kwoty z wartoscia
    - regex: '(?<!\d)\d{2}(?: ?\d{4}){6}(?!\d).{0,800}(?:kwot[aye]|kwocie|wartosc)[^0-9]{0,40}\d+(?: ?\d{3})*[,.]\d{2}(?!\d)|(?:kwot[aye]|kwocie|wartosc)[^0-9]{0,40}\d+(?: ?\d{3})*[,.]\d{2}(?!\d).{0,800}(?<!\d)\d{2}(?: ?\d{4}){6}(?!\d)'
      weight: 4
  # Potwierdzenie przelewu zawsze zawiera numer rachunku (IBAN, 26 cyfr) ORAZ albo tytul dokumentu
  # (linia "Potwierdzenie ..."), albo komplet etykiet slipu bankowego: nadawca + odbiorca.
  # Sam IBAN z kwota (faktura, umowa, SWZ, ogloszenie) nie wystarcza.
  required_any:
    - all_of:
        - 're:(?<!\d)\d{2}(?: ?\d{4}){6}(?!\d)'
        - "@title"
    - all_of:
        - 're:(?<!\d)\d{2}(?: ?\d{4}){6}(?!\d)'
        - 're:(z rachunku|rachunek nadawcy|rachunek zleceniodawcy|rachunek obciazany|zleceniodawc|nadawc|numer transakcji)'
        - 're:(na rachunek|beneficjent|odbiorc|kontrahent)'
  min_score: 6.0
  min_margin: 2.0
# Ekstrakcja pol (DSL silnika odw2json/extract/engine.py, opis: docs/nowy-typ-dokumentu.md).
# Etykiety dopasowywane bez polskich znakow i wielkosci liter; kolejnosc ekstraktorow = priorytet.
fields:
  przelew_bankowy.data_operacji:
    type: date
    extract:
      - label: [data operacji, data transakcji, data realizacji, data wykonania, data ksiegowania, data zaksiegowania,
                data przelewu, data zlecenia, data platnosci, data waluty, w dniu]
        max_chars: 60
      # skany (E7): OCR gubi kropki w dacie („Zlecona data wykonania 20 04 2026”)
      - label: [data wykonania, data realizacji, data operacji]
        value: '(?<!\d)\d{1,2} \d{1,2} \d{4}(?!\d)'
        max_chars: 40
      # skany (E7): etykieta rozbita na dwie linie („Data 2026-03-26⏎wykonania”)
      - regex: '(?m)^[ \t]*data[ \t]+(?P<v>\d{4}-\d{2}-\d{2}|\d{1,2}\.\d{1,2}\.\d{4})[ \t]*\n[ \t]*(?:wykonania|operacji|transakcji|realizacji)\b'
  przelew_bankowy.kwota:
    type: amount
    extract:
      - label: [kwota przelewu, kwota operacji, kwota transakcji, kwota platnosci, kwota, w kwocie, wartosc]
        max_chars: 60
    validate: {min: 0.01}
  przelew_bankowy.z_rachunku:
    type: iban
    extract:
      # 1) etykieta rachunku nadawcy; 2) pierwszy IBAN po danych nadawcy; 3) pierwszy IBAN w dokumencie
      - label: [z rachunku, rachunek nadawcy, rachunek zleceniodawcy, rachunek obciazany, rachunek platnika, rachunek obciazony]
        max_chars: 80
      - near: {phrases: [dane nadawcy, nadawca, zleceniodawca, platnik], direction: after, max_chars: 250}
      - regex: {pattern: '(?<![\dA-Za-z])(?:PL\s?)?\d{2}(?:\s?\d{4}){6}(?!\d)', nth: 1}
  przelew_bankowy.na_rachunek:
    type: iban
    extract:
      - label: [na rachunek, rachunek odbiorcy, rachunek beneficjenta, rachunek uznawany, rachunek adresata]
        max_chars: 80
      - near: {phrases: [dane odbiorcy, odbiorca, beneficjent, adresat przelewu, adresat], direction: after, max_chars: 250}
      - regex: {pattern: '(?<![\dA-Za-z])(?:PL\s?)?\d{2}(?:\s?\d{4}){6}(?!\d)', nth: 2}
  przelew_bankowy.numer_transakcji:
    type: str
    extract:
      # identyfikator: ciag liter/cyfr (>= 8 znakow, z cyfra) w oknie po etykiecie
      - label: [numer transakcji, numer referencyjny, nr referencyjny, nr ref., nr ref, identyfikator operacji, identyfikator transakcji, identyfikator platnosci, numer operacji, numer platnosci,
                nr transakcji, nr operacji, nr platnosci, id transakcji, id operacji]
        value: '(?<![A-Za-z0-9])(?=[A-Za-z0-9]*\d)[A-Za-z0-9]{8,}(?![A-Za-z0-9])'
        max_chars: 60
      # skany (E7): etykieta rozbita na dwie linie („Numer 305494⏎transakcji”), numer krótszy niż 8 znaków
      - regex: '(?m)^[ \t]*numer[ \t]+(?P<v>[A-Za-z0-9]{4,})[ \t]*\n[ \t]*transakcji\b'
  przelew_bankowy.tytul:
    type: str
    extract:
      # tytul bywa zawiniety: doklejamy kolejne linie do pustej linii albo nastepnej etykiety
      - label:
          # „szczegoty platnosci” = OCR „Szczegóły płatności” (E7)
          labels: [tytul platnosci, tytul przelewu, tytul operacji, opis operacji, opis platnosci, tresc przelewu,
                   tresc platnosci, cel platnosci, tytulem, tytul, opis, szczegoly platnosci, szczegoty platnosci]
          line_start: true
          multiline: true
          max_lines: 6
          blank_lines: 1   # jedna pusta linia wewnatrz tytulu (zawiniecie), o ile dalej nie ma etykiety
          stop: [nr ref, nr klienta, nr transakcji, nr operacji, nr platnosci, numer, identyfikator, kwota, wartosc, data, status, waluta, kanal, typ operacji,
                 tryb, oplata, zrealizowano, wykonano, nadawca, odbiorca, platnik, zleceniodawca, adresat, beneficjent,
                 dane nadawcy, dane odbiorcy, rachunek, z rachunku, na rachunek, z powazaniem, bank, potwierdzenie,
                 typ, dokument, strona, niniejsze, signature,
                 're:^-{3,}', 're:^\*{3}']
      # skany (E7): OCR przestawia kolumny — wartość, a za nią etykieta „Opis” w tej samej linii
      - regex: '(?m)^(?P<v>[^\n]{10,}?)[ \t]+Opis[ \t]*$'
        case: true
    normalize: [ws, trim_quotes]
    validate: {min_len: 3}
llm:
  prompt: prompts/przelew.md
