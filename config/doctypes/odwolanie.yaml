id: odwolanie
title: Odwołanie do Krajowej Izby Odwoławczej
output_template: schemas/odwolanie.json
classify:
  # Frazy i regexy dzialaja na tekscie znormalizowanym (male litery, bez polskich znakow).
  # Tytul "ODWOLANIE" stoi po blokach adresowych stron - stad dluzszy naglowek.
  title: ["odwolanie"]
  header_chars: 1500
  strong: ["odwolanie", "odwolujacy", "zarzut", "krajowej izby odwolawczej"]
  weak: ["zamawiajacy", "prawo zamowien publicznych", "wnosze o"]
  negative: ["ogloszenie o zamowieniu", "wyrok", "postanowienie", "udzielam pelnomocnictwa", "kwota przelewu"]
  patterns:
    - {regex: 'odwolujacy:', weight: 3}
    - {regex: 'zarzut nr \d+', weight: 3}
  min_score: 8.0   # pojedyncze slowa domenowe (np. w wyroku KIO) nie wystarcza
  min_margin: 2.0
# Sektor B: opis pol (metoda, normalizacja, zrodla). Format wolny do czasu ustalenia przez B.
fields:
  OdwolanieKIO.czynnosc_opis:
    derived: {lookup: czynnosc_powod, from: OdwolanieKIO.czynnosc_powod_id}
llm:
  prompt: prompts/odwolanie.md
