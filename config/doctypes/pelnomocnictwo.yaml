id: pelnomocnictwo
title: Pełnomocnictwo
output_template: schemas/pelnomocnictwo.json
classify:
  # Frazy i regexy dzialaja na tekscie znormalizowanym (male litery, bez polskich znakow).
  # Tytul w naglowku; rozstrzelone "P E L N O M O C N I C T W O" jest zwijane przed dopasowaniem.
  title: ["pelnomocnictwo"]
  title_mode: line
  title_line_min_cover: 0.5   # "PELNOMOCNICTWO PROCESOWE" = 58% linii
  header_chars: 600
  strong: ["pelnomocnictw", "udzielam", "udzielaja", "mocodawc"]
  weak: ["do reprezentowania", "krajowej izby odwolawczej", "ustanawiam", "upowazniam"]
  negative: ["kwota przelewu", "zarzut nr", "ogloszenie o zamowieniu"]
  min_score: 5.0
  min_margin: 1.0
# Ekstrakcja pol (DSL silnika odw2json/extract/engine.py, opis: docs/nowy-typ-dokumentu.md, decyzje:
# docs/decyzje/E4-ekstrakcja.md, sekcja "pelnomocnictwo"). Imie i nazwisko = dwa wyrazy z wielkiej litery
# (drugi moze miec czlon po myslniku); regexy imion z `case: true`, bo tylko wielkosc liter odroznia
# "Jan Nowak" od "jest umocowany". Tytuly (adw., r. pr., radca prawny, adwokat) nie wchodza do wartosci.
fields:
  # ---------------------------------------------------------------- mocodawca (osoba prawna albo fizyczna)
  mocodawca[].data.imie_nazwisko:
    type: name
    extract:
      # tylko osoba fizyczna: "Ja, nizej podpisany Jan Nowak, prowadzacy dzialalnosc gospodarcza ..."
      - regex:
          pattern: '(?i:podpisan\w*)(?:/a|\(a\))?,?\s+(?P<v>[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+[ \t]+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?)\s*,\s*(?i:prowadz)'
          case: true
  mocodawca[].data.krs:
    extract:
      - label: [krs]
        value: '(?<!\d)\d{10}(?!\d)'
        max_chars: 60
    normalize: [krs]
  mocodawca[].data.nazwa:
    type: company
    extract:
      # 1) osoba fizyczna: "pod firma DUDEK-TECH Jan Nowak, ul. ..."
      - regex: '(?i:pod\s+firm[aą])\s+(?P<v>[^,(;]{2,150}?)\s*,\s*(?:ul\.|al\.|pl\.|os\.|NIP|REGON)'
      # 2) po zapowiedzi: "Mocodawca jest X, ul." / "w imieniu X (dalej" / "do reprezentacji X (KRS" /
      #    pozycja konsorcjum "1) X, ul." (nazwa moze byc zawinieta na 2 linie)
      - regex:
          pattern: '(?:(?i:mocodawc[aą]\s+jest|w\s+imieniu|do\s+reprezentacji)\s+|(?:(?i:konsorcjum)\)?\s*:\s*|;\s*)\d{1,2}\)\s+)(?P<v>[A-ZĄĆĘŁŃÓŚŹŻ0-9„"][^\n,(:;]{1,120}?(?:\n[^\n,(:;]{1,80}?)?)(?=\s*(?:,\s*(?:ul\.|al\.|pl\.|os\.|KRS)|\(|\s+z\s+siedzib))'
          case: true
      # 3) "X z siedziba w ..." (takze w skanach, gdzie OCR przestawia kolejnosc linii)
      - regex:
          pattern: '(?P<v>[A-ZĄĆĘŁŃÓŚŹŻ][^\n,(:;]{1,120}?)\s+z\s+siedzib'
          case: true
      # 4) tabela: "Mocodawca X" w jednej linii; 5) naglowek "MOCODAWCA" i nazwa w nastepnej linii
      - regex:
          pattern: '^[ \t]*Mocodawca[ \t]+(?P<v>[A-ZĄĆĘŁŃÓŚŹŻ][^\n]+?)[ \t]*$'
          case: true
      - regex:
          pattern: '^[ \t]*MOCODAWCA[ \t]*\n[ \t]*(?P<v>[^\n]+?)[ \t]*$'
          case: true
      # 6) "X, ul. ..." od poczatku linii; 7) naglowek: X w linii, adres w nastepnej
      - regex:
          pattern: '^[ \t]*(?P<v>[A-ZĄĆĘŁŃÓŚŹŻ][^\n,(:;]{2,120}?),\s*(?:ul\.|al\.|pl\.)'
          case: true
      - regex:
          pattern: '^[ \t]*(?P<v>[A-ZĄĆĘŁŃÓŚŹŻ][^\n,(:;]{2,120}?)[ \t]*\n[ \t]*(?:ul\.|al\.|pl\.)'
          case: true
    validate: {min_len: 3}
  mocodawca[].data.nip:
    extract:
      # NIP bywa z myslnikami (999-295-65-50, 999-99-29-154); w skanach OCR wstawia adres miedzy etykiete a numer
      - label: [nip]
        value: '(?<!\d)\d(?:[ \-]?\d){9}(?!\d)'
        max_chars: 160
    normalize: [nip]
  mocodawca[].data.typ:
    extract:
      - if_match:
          # "prowadzacy/a dzialalnosc gospodarcza" (druk z ukosnikiem), CEIDG
          phrases: ['re:prowadz\w*(?:/\w{1,2})?\s+dzialalnosc\w*\s+gospodarcz', centralnej ewidencji, ceidg]
          then: osoba_fizyczna
      - const: osoba_prawna
  # ---------------------------------------------------------------- osoby podpisujace w imieniu mocodawcy
  mocodawca[].podpisujacy[].imie_nazwisko:
    type: name
    extract:
      # imie i nazwisko w osobnej linii (pod kropkami) albo po "przez:" / przecinku, przed funkcja "- Prezes"
      - regex:
          pattern: '(?:^[ \t]*|(?i:przez):?[ \t]+|,[ \t]*)(?!(?:Prezes|Wiceprezes|Członek|Dyrektor|Prokurent|Pełnomocni|Mocodaw|Zarząd|Wspólnik|Właściciel|Komplementariusz|Kierownik|Główn|Data|Signature|Dokument|Kancelaria|Za)\b)(?P<v>[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+[ \t]+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?)(?=[ \t]*(?:$|[-–(]))'
          case: true
  # ---------------------------------------------------------------- pelnomocnicy
  pelnomocnicy[].imie_nazwisko:
    type: name
    extract:
      # pierwszy "Imie Nazwisko" w elemencie (element zaczyna sie od tytulu / numeru / "oraz"); zawiniecie linii dozwolone
      - regex:
          pattern: '(?P<v>[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:[ \t]+|[ \t]*\n[ \t]*)[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?)'
          case: true
  pelnomocnicy[].pesel:
    extract:
      - label: [pesel]
        value: '(?<!\d)\d{11}(?!\d)'
        max_chars: 30
    normalize: [pesel]
lists:
  mocodawca:
    # konsorcjum: "(Konsorcjum): 1) A ..., KRS ...; 2) B ... (dalej lacznie" - jeden element na pozycje;
    # inaczej (brak "konsorcj") jeden element = caly dokument (\A bez slowa "konsorcj" w tekscie)
    split:
      start: 're:\A(?![\s\S]*konsorcj)|konsorcj'
      end: 're:dalej\s+lacznie'
      item_sep: 're:(?:konsorcjum\)?\s*:\s*|;\s*)\d{1,2}\)\s'
    max_items: 10
  mocodawca[].podpisujacy:
    # podpisy: od pierwszej linii kropek (albo "reprezentowana przez:", "podpisany przez", "Za Mocodawce")
    # do "Pelnomocnictwo przyjmuje" / "(dalej"; konsorcjum: i-ty blok "W imieniu X:" = i-ty mocodawca
    split:
      start: 're:^[ \t]*\.{5,}|reprezentowan\w*\s+przez\s*:|podpisany\s+przez|^[ \t]*za\s+mocod'
      end: 're:pelnomocnictwo\s+przyjmuj|\(dalej'
      item_regex: '(?m:^[ \t]*|(?i:przez):?[ \t]+|,[ \t]*)(?!(?:Prezes|Wiceprezes|Członek|Dyrektor|Prokurent|Pełnomocni|Mocodaw|Zarząd|Wspólnik|Właściciel|Komplementariusz|Kierownik|Główn|Data|Signature|Dokument|Kancelaria|Za)\b)[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+[ \t]+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?(?=[ \t]*(?:$|[-–(]))'
    groups:
      start: 're:^[ \t]*w\s+imieniu[^\n]{3,120}:[ \t]*$'
      end: 're:pelnomocnictwo\s+przyjmuj'
      item_sep: 're:^[ \t]*w\s+imieniu[^\n]{3,120}:[ \t]*$'
    unique: true
    max_items: 10
  pelnomocnicy:
    # blok od zapowiedzi ("udzielam pelnomocnictwa", "ustanawiam pelnomocnikiem", "Pelnomocnicy", "PELNOMOCNIK")
    # do "do reprezentowania" / "Zamawiajacy" / "§ 3" / "Niniejszym" / tytulu dokumentu;
    # element = tytul + imie i nazwisko | linia z samym nazwiskiem (skany, "1. Jan Nowak - adwokat") | "oraz Jan Nowak ("
    split:
      start: 're:udziel\w*\s+pelnomocnictw\w*|ustanawiam\s+pelnomocnik\w*|upowazniam|niniejszym\s+udziela\w*|(?<![a-z])pelnomocni(?:k|cy)(?![a-z])'
      end: 're:do\s+reprezentowania|^[ \t]*zamawiajac|pelnomocnictwo\s+udzielone|§\s*3|niniejszym|^[ \t]*p\s?e\s?l\s?n\s?o\s?m\s?o\s?c\s?n\s?i\s?c\s?t\s?w\s?o'
      item_regex: '(?:\b[Aa]dw\.|\b[Rr]\.[ \t]?[Pp]r\.|\b[Rr]adc[aey][ \t]+[Pp]rawn\w*|\b[Aa]dwokat(?:em)?)\s+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+\s+[A-ZĄĆĘŁŃÓŚŹŻ]|^[ \t]*(?:\d{1,2}[.)][ \t]*)?(?!(?:Prezes|Wiceprezes|Członek|Dyrektor|Prokurent|Pełnomocni|Mocodaw|Zamawiaj|Kancelaria)\b)[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+[ \t]+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?(?=[ \t]*(?:$|\(|–|-|,))|\boraz[ \t]+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+[ \t]+[A-ZĄĆĘŁŃÓŚŹŻ]'
    unique: true
    max_items: 10
llm:
  prompt: prompts/pelnomocnictwo.md
